# ----------------------------------------------------- 
# General window rules
# ----------------------------------------------------- 

# browser picture in picture
windowrule = float on, pin on, move ((monitor_w*0.695)) ((monitor_h*0.04)), match:title ^(Picture-in-Picture)$

# wlogout
layerrule = blur on, match:namespace logout_dialog

# swaync
layerrule = blur on, ignore_alpha 0.5, match:namespace swaync-control-center
layerrule = blur on, ignore_alpha 0.5, match:namespace swaync-notification-window

# ----------------------------------------------------- 
# Per application window rules
# ----------------------------------------------------- 

# moonlight
windowrule = immediate on, match:class ^(com.moonlight_stream.Moonlight)$

# pavucontrol
windowrule = float on, size 700 600, move ((monitor_w*1)-window_w-40) (50), match:class (.*org.pulseaudio.pavucontrol.*)

# blueman
windowrule = float on, size 700 600, move ((monitor_w*1)-window_w-40) (50), match:class (.blueman-manager-wrapped)

# iwgtk
windowrule = float on, size 700 600, move ((monitor_w*1)-window_w-40) (50), match:class (org.twosheds.iwgtk)

# gnome
windowrule = float on, size 700 600, center on, match:class (org.gnome.Calculator)

# emoji
windowrule = float on, pin on, move ((monitor_w*1)-window_w-100) ((monitor_h*0.5)), match:class (it.mijorus.smile)

# wofi
bezier = myBezier, 0.10, 0.9, 0.1, 1.05
animation = windows, 1, 7, myBezier, slide
animation = windowsOut, 1, 7, myBezier, slide
windowrule = animation windowOut, match:class ^(wofi)$

# zfxtop
windowrule = float on, pin on, size 700 700, move (50) (50), match:class ^(zfxtop)$

# gping
windowrule = float on, pin on, size 700 220, move (50) (50), match:class ^(gping)$

# meteo
windowrule = float on, size 1200 860, center on, match:class ^(meteo)$

# discord
windowrule = workspace 3 silent, match:class ^(vesktop|webcord)$
