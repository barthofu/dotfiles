exec-once = hyprlock # lock screen on startup to simulate a login screen

# load waybar (delayed: on a real relogin the systemd session-target
# reset in progress in home-manager's hyprland module still restarts
# xdg-desktop-portal; launching waybar immediately can race that portal
# restart and hit the "StartServiceByName timed out" error)
exec-once = sleep 3; $HOME/.config/waybar/launch.sh

# load wallpaper
exec-once = sleep 3; $HOME/.local/scripts/restore_wallpaper.sh

# start udiskie
exec-once = udiskie

# hypridle is started by home-manager as a systemd user service (services.hypridle),
# do not exec it here too: a second instance was spawning with a broken
# HYPRLAND_INSTANCE_SIGNATURE, holding a duplicate sleep-inhibitor and racing with the real one.

# start swaync
exec-once = swaync

# xdg
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP

# misc
exec-once = jellyfin-mpv-shim
exec-once = elephant 

# launch apps on workspaces
exec-once = [workspace 1 silent] code
exec-once = [workspace 2 silent] firefox
exec-once = [workspace 3 silent] vesktop
exec-once = [workspace 4 silent] bash -c "sleep 15; soundcloud"
exec-once = [workspace 4 silent] spotify

exec-once = hyprctl setcursor Bibata-Modern-Classic 18

# misc
exec-once = bash -c "sleep 5; $HOME/.local/scripts/connect_bluetooth.sh bp50 && sleep 10 && $HOME/.local/scripts/connect_bluetooth.sh bp50"

# Setup XDG for screen sharing
# exec-once = ~/.config/hypr/scripts/xdg.sh

# Load Dunst Notification Manager
# exec-once = dunst

# Restore wallpaper and launch waybar
# exec-once = ~/.config/hypr/scripts/wallpaper-restore.sh

# Load GTK settings
# exec-once = ~/.config/hypr/scripts/gtk.sh

# Using hypridle to start hyprlock
# exec-once = hypridle

# Autostart ML4W App
# exec-once = ~/.config/ml4w/scripts/ml4w-autostart.sh

# Start ewww daemon
# exec-once = ags &

# Start autostart cleanup
# exec-once = ~/.config/hypr/scripts/cleanup.sh

