# ----------------------------------------------------- 
# Transparency Configuration
# ----------------------------------------------------- 

# Firefox transparency - BUT NOT on YouTube
windowrule = opacity 0.8 override, match:class ^(firefox)$, match:title ^((?!.*YouTube).)*$
windowrule = opacity 0.8 override, match:title (.*)(Visual Studio Code)$
windowrule = opacity 0.7 override, ^(alacritty|vesktop|webcord|org.nickvision.cavalier|meteo|zfxtop|gping|obsidian)$ on, ^(thunar|.blueman-manager-wrapped|org.twosheds.iwgtk|org.pulseaudio.pavucontrol)$ on
windowrule = opacity 0.8 override, match:title ^(SoundCloud)(.*)$
windowrule = opacity 0.7 override, match:title ^(Spotify)(.*)$
windowrule = opacity 0.9 override, match:class ^(wofi)$